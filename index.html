<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BLACKNODE SYSTEM</title>  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Consolas, monospace;
    }

    body{
      background:black;
      overflow:hidden;
      color:#00ff88;
    }

    canvas{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      z-index:-1;
    }

    .overlay{
      position:absolute;
      inset:0;
      background:rgba(0,0,0,0.45);
      backdrop-filter:blur(2px);
    }

    .container{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      text-align:center;
      padding:20px;
    }

    .logo{
      font-size:55px;
      letter-spacing:6px;
      color:#00ff88;
      text-shadow:0 0 10px #00ff88,
                  0 0 25px #00ff88;
      animation:flicker 2s infinite;
    }

    .subtitle{
      margin-top:10px;
      color:#77ffcc;
      opacity:0.8;
      letter-spacing:3px;
      font-size:14px;
    }

    .terminal{
      margin-top:40px;
      width:90%;
      max-width:800px;
      background:rgba(0,0,0,0.6);
      border:1px solid #00ff88;
      padding:20px;
      border-radius:15px;
      box-shadow:0 0 20px rgba(0,255,136,0.4);
      text-align:left;
      min-height:260px;
    }

    .line{
      margin:10px 0;
      white-space:nowrap;
      overflow:hidden;
      border-right:2px solid #00ff88;
      width:0;
      animation:typing 3s steps(40,end) forwards;
    }

    .line:nth-child(2){animation-delay:2s;}
    .line:nth-child(3){animation-delay:4s;}
    .line:nth-child(4){animation-delay:6s;}

    .access{
      margin-top:30px;
      display:flex;
      gap:10px;
    }

    input{
      background:black;
      border:1px solid #00ff88;
      color:#00ff88;
      padding:12px;
      width:250px;
      outline:none;
      border-radius:10px;
    }

    button{
      background:#00ff88;
      color:black;
      border:none;
      padding:12px 20px;
      cursor:pointer;
      border-radius:10px;
      font-weight:bold;
      transition:0.3s;
    }

    button:hover{
      transform:scale(1.05);
      box-shadow:0 0 15px #00ff88;
    }

    .status{
      margin-top:20px;
      color:#ff4d4d;
      min-height:20px;
    }

    .clock{
      position:absolute;
      top:20px;
      right:20px;
      color:#00ff88;
      font-size:15px;
      opacity:0.8;
    }

    @keyframes flicker{
      0%,18%,22%,25%,53%,57%,100%{
        opacity:1;
      }
      20%,24%,55%{
        opacity:0.4;
      }
    }

    @keyframes typing{
      from{width:0}
      to{width:100%}
    }
  </style></head>
<body><canvas id="matrix"></canvas>

  <div class="overlay"></div>  <div class="clock" id="clock"></div>  <div class="container">
    <h1 class="logo">BLACKNODE</h1>
    <p class="subtitle">CLASSIFIED ACCESS SYSTEM</p><div class="terminal">
  <div class="line">> Initializing encrypted protocol...</div>
  <div class="line">> Connecting to BLACKNODE database...</div>
  <div class="line">> Identity trace hidden successfully...</div>
  <div class="line">> Awaiting user authorization...</div>
</div>

<div class="access">
  <input type="password" id="password" placeholder="ENTER ACCESS KEY" />
  <button onclick="login()">ENTER</button>
</div>

<div class="status" id="status"></div>

  </div>  <script>
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const letters = '01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&';
    const fontSize = 14;
    const columns = canvas.width / fontSize;

    const drops = [];

    for(let x = 0; x < columns; x++){
      drops[x] = 1;
    }

    function draw(){
      ctx.fillStyle = 'rgba(0,0,0,0.08)';
      ctx.fillRect(0,0,canvas.width,canvas.height);

      ctx.fillStyle = '#00ff88';
      ctx.font = fontSize + 'px monospace';

      for(let i = 0; i < drops.length; i++){
        const text = letters[Math.floor(Math.random()*letters.length)];

        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if(drops[i] * fontSize > canvas.height && Math.random() > 0.975){
          drops[i] = 0;
        }

        drops[i]++;
      }
    }

    setInterval(draw, 35);

    function login(){
      const pass = document.getElementById('password').value;
      const status = document.getElementById('status');

      if(pass === 'queen'){
        status.style.color = '#00ff88';
        status.innerHTML = 'ACCESS GRANTED — Welcome back, Queen.';
      }else{
        status.style.color = '#ff4d4d';
        status.innerHTML = 'ACCESS DENIED — Unauthorized user detected.';
      }
    }

    function updateClock(){
      const now = new Date();
      document.getElementById('clock').innerHTML = now.toLocaleTimeString();
    }

    setInterval(updateClock,1000);
    updateClock();
  </script></body>
    </html>
